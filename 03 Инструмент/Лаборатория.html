<script id="snapshot" type="application/json">{"entries": [{"id": 1, "title": "Карта смены решения", "entrypoint": "Демо.html", "evidence": "scenario-grid.csv", "result": "Проверены 363 сочетания нагрузки и мощности по трём бассейнам. Каждая ячейка пересчитывается при выборе.", "limitation": "Мощности и резерв задаёт пользователь. Учёт сроков можно явно включить или выключить.", "status": "реализовано"}, {"id": 2, "title": "Проверка устойчивости рекомендации", "entrypoint": "Демо.html", "evidence": "scenario-grid.csv", "result": "Инструмент проверяет пять точек в диапазоне нагрузки вокруг ввода и сообщает, если предпочтительное действие меняется.", "limitation": "Диапазон имеет смысл стресс-сценария. Вероятности этим точкам не присвоены.", "status": "реализовано"}, {"id": 3, "title": "Порог дополнительной цены", "entrypoint": "Демо.html", "evidence": "scenario-grid.csv", "result": "Разница превышения между лучшим и следующим доступным действием даёт предельную доплату через ценность тонны снижения превышения.", "limitation": "Расходы и стоимость тонны оценивает оператор. Сравнение в тоннах само по себе не определяет экономическую выгоду.", "status": "реализовано"}, {"id": 4, "title": "Ретропроверка выбора действий", "entrypoint": "forecast.py", "evidence": "decision-replay.csv", "result": "Среднее превышение на двухквартальное окно. Балтика 2,74 → 1,74 млн т. юг 5,7 → 4,56 млн т. Дальний Восток 2,84 → 2,24 млн т.", "limitation": "По пять перекрывающихся окон. Оба целевых квартала начинаются после даты публикации входных данных. Мощности условны, действия считаются заранее согласованными.", "status": "реализовано"}, {"id": 5, "title": "Допустимость действий", "entrypoint": "Демо.html", "evidence": "evidence/13-calendar-qualified-actions.csv", "result": "Флажок переноса и календарь меняют набор доступных действий. При дате 09.11.2026 и сроке 90 дней перенос в I квартал 2027 исключается.", "limitation": "При выключенном календаре сравниваются заранее согласованные варианты.", "status": "реализовано"}, {"id": 6, "title": "Записка о сценарии", "entrypoint": "Демо.html", "evidence": "evidence/06-memo-example.txt", "result": "Кнопка выгружает текущие вводные, сроки, доступные действия и результат в текстовый файл.", "limitation": "Записка отражает параметры на момент выгрузки.", "status": "реализовано"}, {"id": 7, "title": "Аудит выпусков и пересмотров", "entrypoint": "checks.py", "evidence": "evidence/07-release-discrepancies.csv", "result": "Проверены даты 18 выпусков. Медианный лаг 13 дней. PDF АСОП подтверждают другой компаратор Балтики за 2023 год 271,3 млн т и уровень юга за I полугодие 2024 года 139,9 млн т.", "limitation": "Основной ряд сохраняет уровни новостных выпусков. Отдельная таблица показывает чувствительность к PDF-компараторам. Причина пересмотров не установлена.", "status": "реализовано"}, {"id": 8, "title": "Сверка следующего периода", "entrypoint": "holdout.py", "evidence": "evidence/08-frozen-holdout.csv", "result": "Из июльского среза восстановлен прогноз Балтики на III квартал 2026 года 68,1 млн т. Вторичная публикация даёт предварительную сверку 69,2 млн т, отклонение +1,1.", "limitation": "Это ретроспективная реконструкция. Сопоставимый первичный выпуск III квартала не подтверждён. Сверка вынесена за основную оценку точности.", "status": "реализовано с ограничением источника"}, {"id": 9, "title": "Перенос на третий бассейн", "entrypoint": "forecast.py", "evidence": "evidence/09-geographic-transfer.csv", "result": "Дальневосточный бассейн прошёл тот же расчёт без настройки. MAE сезонного ориентира на горизонте четырёх кварталов 4,93 млн т.", "limitation": "На каждый метод и горизонт шесть целевых кварталов. Это ограничивает силу вывода.", "status": "реализовано"}, {"id": 10, "title": "Несимметричные стрессы", "entrypoint": "planning.py", "evidence": "evidence/10-asymmetric-stress.csv", "result": "Семь профилей на три бассейна. Нагрузка и мощность меняются независимо по кварталам, включая сдвиг пика и падение подходной мощности.", "limitation": "Квартал резервирования фиксируется до сравнения стрессов. Эти профили заданы как условия.", "status": "реализовано"}, {"id": 11, "title": "Выбор по худшему сценарию", "entrypoint": "planning.py", "evidence": "evidence/11-minimax.csv", "result": "На Балтике минимакс выбирает перенос. Худшее превышение снижается с 9,76 до 9,06 млн т ценой +0,3 млн т в центральном сценарии.", "limitation": "Эта таблица предполагает заранее согласованный перенос. По календарю из пункта 13 он сейчас исключён.", "status": "реализовано"}, {"id": 12, "title": "Минимальный резерв после переноса", "entrypoint": "planning.py", "evidence": "evidence/12-minimum-hybrid-reserve.csv", "result": "В центральном сценарии гибкий резерв по кварталам уменьшается с 2,0 до 0,3 млн т на Балтике и с 8,7 до 4,7 млн т на юге.", "limitation": "Подбирается резерв для каждого заданного сценария с возможностью распределить его по кварталам. Это более гибкая постановка, чем один фиксированный слот H1.", "status": "реализовано"}, {"id": 13, "title": "Предельная дата решения", "entrypoint": "planning.py", "evidence": "evidence/13-decision-calendar.csv", "result": "При сроках 45 и 90 календарных дней дедлайн резервирования II квартала — 15.02.2027, переноса в I квартал — 03.10.2026.", "limitation": "Сроки вводные. Второй CSV показывает результат после исключения закрытых действий.", "status": "реализовано"}, {"id": 14, "title": "Совместимость мощностей с грузом", "entrypoint": "planning.py", "evidence": "evidence/14-cargo-compatibility.csv", "result": "На Балтике во II квартале 2025 сумма условных мощностей 70 млн т покрывает общий объём 67,7. Раздельно сухих грузов сверх лимита 1,9 млн т.", "limitation": "Объёмы сухих и наливных грузов опубликованы АСОП. Лимиты 30 и 40 млн т заданы для демонстрации.", "status": "реализовано"}, {"id": 15, "title": "Ограничивающее звено терминала", "entrypoint": "planning.py", "evidence": "evidence/15-terminal-bottleneck.csv", "result": "При условной нагрузке 5,2 млн т расширение причала не снимает дефицит 0,9. Усиление железнодорожного подвоза уменьшает его до 0,4, совместное усиление подвоза и склада — до нуля.", "limitation": "Это сценарий одного узла с мощностями 6,0 / 4,8 / 4,3 млн т. Реальные терминальные данные нужны от оператора.", "status": "реализовано"}, {"id": 16, "title": "Перевод в смены и поезда", "entrypoint": "planning.py", "evidence": "evidence/16-resource-conversion.csv", "result": "Для 0,9 млн т исходного терминального превышения получены условные эквиваленты 322 смены или 231 поезд по заданной производительности.", "limitation": "Нормы 2800 т/смену и 3900 т/поезд вводные. Эквиваленты относятся к совместимому грузу и требуют снятия ограничения в нужном звене.", "status": "реализовано"}, {"id": 17, "title": "Накопление объёма и восстановление", "entrypoint": "planning.py", "evidence": "evidence/17-backlog-flow.csv", "result": "Модель переносит необработанный объём между кварталами, сохраняет баланс и выдаёт пик, остаток и квартал восстановления.", "limitation": "Фактические заявки и очередь не наблюдались. Годовой поток условно повторяет сезонный профиль, III–IV кварталы 2027 выходят за проверенный горизонт.", "status": "реализовано"}, {"id": 18, "title": "Календарь нескольких ремонтов", "entrypoint": "planning.py", "evidence": "evidence/18-maintenance-schedules.csv", "result": "Перебор учитывает разрешённые старты, длительность и один ремонт одновременно. На Балтике выбранный календарь снижает годовое превышение с 5,5 до 3,8 млн т.", "limitation": "Ограничения и годовой поток условны. Результат требует подтверждения доступных окон.", "status": "реализовано"}, {"id": 19, "title": "Срок ввода новой инфраструктуры", "entrypoint": "planning.py", "evidence": "evidence/19-lugaport-timing.csv", "result": "Для проекта терминала Усть-Луга с годовой мощностью 24,3 млн т рассчитан условный ввод во II квартале и задержка до IV. До ввода модель считает требуемый резерв.", "limitation": "Из Росморпорта взята только годовая мощность. График, доля совместимого груза, разгон и нагрузка узла заданы для сценария.", "status": "реализовано"}, {"id": 20, "title": "Пилот с критериями перехода", "entrypoint": "pilot.py", "evidence": "evidence/20-pilot-log-template.csv", "result": "Готовы форма журнала и программа оценки. Она требует 12 непрерывных недель, наблюдения перегрузок и спокойных недель, проверяет WAPE, ложные тревоги и пропущенные перегрузки.", "limitation": "Пилот предполагается после чемпионата. Учебный CSV имеет маркировку synthetic и сохраняет её в результате. Для расширения отдельно проверяется выполнение заявок в двух группах.", "status": "реализовано"}], "tables": {"scenario-grid.csv": [{"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "-10", "base_gap_Mt": "5.4", "reserve_gap_Mt": "2.4", "move_gap_Mt": "5.27", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "-8", "base_gap_Mt": "7.876", "reserve_gap_Mt": "4.876", "move_gap_Mt": "7.876", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "-6", "base_gap_Mt": "10.482", "reserve_gap_Mt": "7.482", "move_gap_Mt": "10.482", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "-4", "base_gap_Mt": "13.088", "reserve_gap_Mt": "10.088", "move_gap_Mt": "13.088", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "-2", "base_gap_Mt": "15.694", "reserve_gap_Mt": "12.694", "move_gap_Mt": "15.694", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "0", "base_gap_Mt": "18.3", "reserve_gap_Mt": "15.3", "move_gap_Mt": "18.3", "best_gap_action": "reserve"}, {"basin": "baltic", "capacity_Mt_per_quarter": "58", "load_change_percent": "2", "base_gap_Mt": "20.906", "reserve_gap_Mt": "17.906", "move_gap_Mt": "20.906", "best_gap function value(text) {
  if (text === "") return "—";
  if (words[text]) return words[text];
  if (/^-?\d+(\.\d+)?$/.test(text)) return fmt.format(Number(text));
  return text;
}
function heading(key) {
  return words[key] || key.replaceAll("_", " ").replace(/Mt\b/g, "млн т").replace(/percent\b/g,"%");
}
function element(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function dataTable(name) {
  const rows = model.tables[name] ?? [];
  const wrap = element("div", undefined, "scroll");
  if (!rows.length) { wrap.textContent="Форма журнала готова к заполнению. Пример и инструкция доступны в папке evidence."; return wrap; }
  const table = element("table");
  const keys = Object.keys(rows[0]);
  const head = table.createTHead().insertRow();
  for (const key of keys) {
    const th = element("th", heading(key)); th.scope="col"; th.title=key; head.append(th);
  }
  const body = table.createTBody();
  for (const record of rows) {
    const tr = body.insertRow();
    for (const key of keys) {
      const td=tr.insertCell();
      if (record[key].startsWith("https://")) {
        const a=element("a","Источник"); a.href=record[key]; a.target="_blank"; a.rel="noopener"; td.append(a);
      } else td.textContent=value(record[key]);
    }
  }
  wrap.append(table);
  return wrap;
}
