function value(text) {
  if (text === "") return "—";
  if (words[text]) return words[text];
  if (/^-?\d+(\.\d+)?$/.test(text)) return fmt.format(Number(text));
  return text;
}
function heading(key) {
  return words[key] || key.replaceAll("_", " ").replace(/Mt\b/g, "млн т").replace(/percent\b/g,"%");
}
function element(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function dataTable(name) {
  const rows = model.tables[name] ?? [];
  const wrap = element("div", undefined, "scroll");
  if (!rows.length) { wrap.textContent="Форма журнала готова к заполнению. Пример и инструкция доступны в папке evidence."; return wrap; }
  const table = element("table");
  const keys = Object.keys(rows[0]);
  const head = table.createTHead().insertRow();
  for (const key of keys) {
    const th = element("th", heading(key)); th.scope="col"; th.title=key; head.append(th);
  }
  const body = table.createTBody();
  for (const record of rows) {
    const tr = body.insertRow();
    for (const key of keys) {
      const td=tr.insertCell();
      if (record[key].startsWith("https://")) {
        const a=element("a","Источник"); a.href=record[key]; a.target="_blank"; a.rel="noopener"; td.append(a);
      } else td.textContent=value(record[key]);
    }
  }
  wrap.append(table);
  return wrap;
}
const nav=document.getElementById("nav"), main=document.getElementById("main");
const extras={7:["evidence/07-publication-lags.csv","evidence/07-revision-stress.csv"],
  13:["evidence/13-calendar-qualified-actions.csv"],17:["evidence/17-backlog-recovery.csv"]};
for (const entry of model.entries) {
  const title=String(entry.id).padStart(2,"0")+" "+entry.title;
  const link=element("a",title); link.href="#item-"+entry.id; nav.append(link);
  const section=element("section"); section.id="item-"+entry.id;
  section.append(element("h2",title),element("p",entry.result),element("p",entry.limitation,"muted"));
  const links=element("p",undefined,"links");
  for(const [file,label] of [[entry.entrypoint,"Инструмент"],[entry.evidence,"Подтверждающий файл"]]) {
    const a=element("a",label); a.href=file; links.append(a);
  }
  section.append(links);
  for(const name of [entry.evidence,...(extras[entry.id]??[])].filter(x=>x.endsWith(".csv"))) {
    const details=element("details"); details.append(element("summary","Таблица · "+name),dataTable(name));section.append(details);
  }
  main.append(section);
}
document.getElementById("search").addEventListener("input",event=>{
  const text=event.target.value.toLocaleLowerCase("ru");
  for(let i=0;i<model.entries.length;i++){
    const entry=model.entries[i], show=(entry.title+" "+entry.result+" "+entry.limitation).toLocaleLowerCase("ru").includes(text);
    main.children[i].hidden=!show;nav.children[i].hidden=!show;
  }
});
